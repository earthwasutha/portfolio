<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Main gradient: dark navy → sky blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <!-- Text gradient: white → light blue -->
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <!-- Shine overlay gradient -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Diagonal light ray for depth -->
  <polygon points="0,0 55,0 85,100 0,100" fill="white" opacity="0.04" clip-path="url(#clip)"/>

  <!-- Top-right glow orb -->
  <circle cx="80" cy="18" r="22" fill="#38BDF8" opacity="0.12" clip-path="url(#clip)"/>
  <!-- Bottom-left glow orb -->
  <circle cx="18" cy="82" r="16" fill="#818CF8" opacity="0.12" clip-path="url(#clip)"/>

  <!-- Shine top highlight -->
  <rect width="100" height="50" rx="22" fill="url(#shine)" clip-path="url(#clip)"/>

  <!-- Subtle border ring -->
  <rect width="100" height="100" rx="22" fill="none" stroke="white" stroke-width="1.5" opacity="0.10"/>

  <!-- "W" — large, anchored left, slightly high -->
  <text
    x="9" y="61"
    fill="url(#tg)"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="52"
  >W</text>

  <!-- Thin accent slash between W and J -->
  <line x1="63" y1="28" x2="56" y2="72" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- "J" — smaller, bottom-right, slightly lower — creative offset -->
  <text
    x="64" y="76"
    fill="url(#tg)"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="34"
  >J</text>

  <!-- Small accent dot top-right -->
  <circle cx="84" cy="16" r="4" fill="#38BDF8" opacity="0.6"/>
</svg>
